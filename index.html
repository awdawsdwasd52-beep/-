<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>General Chat - Advanced</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: black;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Основной контейнер */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: black;
        }

        /* Левая панель - каналы */
        .channels-sidebar {
            width: 280px;
            background: #0a0a0a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .channels-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .channels-list {
            flex: 1;
            padding: 10px;
        }

        .channel-item {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
        }

        .channel-item:hover {
            background: #1a1a1a;
            color: white;
        }

        .channel-item.active {
            background: #2b2b2b;
            color: white;
        }

        .add-channel-btn {
            margin: 10px;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            text-align: center;
        }

        .add-channel-btn:hover {
            background: #3a3a3a;
        }

        /* Центральная панель - чат */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0a0a0a;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .channel-info h2 {
            font-size: 1.2rem;
        }

        .channel-info p {
            font-size: 0.8rem;
            color: #888;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: black;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        .message.media-message {
            padding: 5px;
        }

        .message.media-message img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            background: #2b2b2b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #1a1a1a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            font-size: 0.7rem;
            margin-bottom: 4px;
            opacity: 0.7;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Нижняя панель */
        .bottom-panel {
            padding: 15px 20px;
            background: black;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .admin-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .admin-btn:hover {
            background: #3a3a3a;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #2a2a2a;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            background: #1a1a1a;
            color: white;
        }

        #messageInput:focus {
            border-color: #4a4a4a;
        }

        .media-buttons {
            display: flex;
            gap: 5px;
        }

        .media-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 0 15px;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
        }

        .media-btn:hover {
            background: #3a3a3a;
        }

        #sendButton {
            background: #2b2b2b;
            color: white;
            border: 1px solid #3a3a3a;
            padding: 0 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendButton:hover {
            background: #3a3a3a;
        }

        /* Правая панель - участники */
        .members-sidebar {
            width: 280px;
            background: #0a0a0a;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .members-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .members-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .member-item {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            background: #2b2b2b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .member-name {
            flex: 1;
            color: white;
        }

        .member-role {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-text {
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            background: #0a0a0a;
            border-top: 1px solid #2a2a2a;
        }

        /* Admin Panel Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content {
            background: #0a0a0a;
            margin: 50px auto;
            padding: 20px;
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 20px;
        }

        .admin-tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #888;
        }

        .admin-tab.active {
            color: white;
            border-bottom: 2px solid #667eea;
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .user-list, .role-list, .channel-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item, .role-item, .channel-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
        }

        .ban-btn, .mute-btn, .delete-btn, .edit-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
            color: white;
        }

        .ban-btn:hover { background: #ff4444; }
        .mute-btn:hover { background: #ffaa44; }
        
        input, select {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 8px;
            color: white;
            border-radius: 5px;
            margin: 5px 0;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-container {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
        }

        .auth-title {
            color: white;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .auth-switch {
            text-align: center;
            color: #888;
            cursor: pointer;
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-bottom: 15px;
        }

        .logout-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    const ADMIN_USERNAME = "SStwendRT";
    
    const firebaseConfig = {
        apiKey: "AIzaSyB9XzL1XzL1XzL1XzL1XzL1XzL1XzL1",
        authDomain: "ipsteal-4bf1c.firebaseapp.com",
        databaseURL: "https://ipsteal-4bf1c-default-rtdb.firebaseio.com/",
        projectId: "ipsteal-4bf1c",
        storageBucket: "ipsteal-4bf1c.firebasestorage.app",
        messagingSenderId: "000000000000",
        appId: "1:000000000000:web:xxxxxxxxxxxx"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const usersRef = database.ref('users');
    const messagesRef = database.ref('channel_messages');
    const bansRef = database.ref('bans');
    const mutesRef = database.ref('mutes');
    const channelsRef = database.ref('channels');
    const rolesRef = database.ref('roles');
    const userRolesRef = database.ref('user_roles');
    
    let currentUser = null;
    let currentChannel = null;
    let isAdmin = false;
    let onlineUsers = new Set();
    
    async function loadMembers() {
        const membersList = document.getElementById('membersList');
        if (!membersList) return;
        
        membersList.innerHTML = '<div style="color:#888;">Загрузка...</div>';
        
        const snapshot = await usersRef.once('value');
        membersList.innerHTML = '';
        
        const users = [];
        snapshot.forEach(child => {
            users.push({
                id: child.key,
                username: child.val().username
            });
        });
        
        for (const user of users) {
            let roleHtml = '';
            const roleSnapshot = await userRolesRef.child(user.id).once('value');
            if (roleSnapshot.exists()) {
                const roleId = roleSnapshot.val();
                const roleData = await rolesRef.child(roleId).once('value');
                if (roleData.exists()) {
                    roleHtml = `<span class="member-role" style="background: ${roleData.val().color};">${roleData.val().name}</span>`;
                }
            }
            
            const memberDiv = document.createElement('div');
            memberDiv.className = 'member-item';
            memberDiv.innerHTML = `
                <div class="member-avatar">${user.username.charAt(0).toUpperCase()}</div>
                <div class="member-name">${escapeHtml(user.username)} ${user.username === ADMIN_USERNAME ? '👑' : ''}</div>
                ${roleHtml}
            `;
            membersList.appendChild(memberDiv);
        }
    }
    
    async function loadChannelsSidebar() {
        const channelsList = document.getElementById('channelsList');
        if (!channelsList) return;
        
        channelsList.innerHTML = '';
        
        const snapshot = await channelsRef.once('value');
        
        if (!snapshot.exists()) {
            const defaultChannel = await channelsRef.push({
                name: 'general',
                displayName: 'Общий чат',
                createdBy: 'system',
                createdAt: Date.now()
            });
            currentChannel = defaultChannel.key;
        }
        
        snapshot.forEach(child => {
            const channel = child.val();
            const channelDiv = document.createElement('div');
            channelDiv.className = `channel-item ${currentChannel === child.key ? 'active' : ''}`;
            channelDiv.textContent = `# ${channel.displayName || channel.name}`;
            channelDiv.onclick = () => switchChannel(child.key);
            channelsList.appendChild(channelDiv);
        });
        
        if (!currentChannel && snapshot.numChildren() > 0) {
            const firstChannel = snapshot.forEach(child => {
                if (!currentChannel) currentChannel = child.key;
            });
        }
        
        updateChannelName();
    }
    
    function updateChannelName() {
        if (!currentChannel) return;
        channelsRef.child(currentChannel).once('value', (snapshot) => {
            const channel = snapshot.val();
            if (channel) {
                document.getElementById('channelName').textContent = `# ${channel.displayName || channel.name}`;
            }
        });
    }
    
    function switchChannel(channelId) {
        currentChannel = channelId;
        loadChannelsSidebar();
        document.getElementById('chatMessages').innerHTML = '';
        listenForMessages();
        updateChannelName();
    }
    
    async function sendMessageWithMedia(type) {
        if (type === 'image') {
            const { value: url } = await Swal.fire({
                title: 'Вставьте ссылку на изображение',
                input: 'url',
                inputPlaceholder: 'https://...',
                showCancelButton: true
            });
            if (url) {
                sendMessage(url, 'image');
            }
        } else if (type === 'gif') {
            const { value: url } = await Swal.fire({
                title: 'Вставьте ссылку на GIF',
                input: 'url',
                inputPlaceholder: 'https://...',
                showCancelButton: true
            });
            if (url) {
                sendMessage(url, 'gif');
            }
        }
    }
    
    async function sendMessage(text, type = 'text') {
        if (!text || !currentUser || !currentChannel) return;
        
        const isMuted = await mutesRef.child(currentUser.id).once('value');
        if (isMuted.exists()) {
            const muteData = isMuted.val();
            if (muteData.expiresAt > Date.now()) {
                Swal.fire('Ошибка', 'Вы замьючены и не можете писать', 'error');
                return;
            } else {
                await mutesRef.child(currentUser.id).remove();
            }
        }
        
        const sendBtn = document.getElementById('sendButton');
        sendBtn.disabled = true;
        
        try {
            const message = {
                text: text,
                username: currentUser.username,
                userId: currentUser.id,
                timestamp: Date.now(),
                type: type,
                channelId: currentChannel
            };
            
            await messagesRef.child(currentChannel).push(message);
            document.getElementById('messageInput').value = '';
            scrollToBottom();
        } catch (error) {
            console.error('Send error:', error);
        } finally {
            sendBtn.disabled = false;
        }
    }
    
    function listenForMessages() {
        if (!currentChannel) return;
        
        const channelMessagesRef = messagesRef.child(currentChannel);
        channelMessagesRef.orderByChild('timestamp').limitToLast(50).on('child_added', async function(snapshot) {
            const message = snapshot.val();
            const messageKey = snapshot.key;
            
            const existingMsg = document.querySelector(`.message[data-key="${messageKey}"]`);
            if (existingMsg) return;
            
            await displayMessage(message, messageKey);
            scrollToBottom();
        });
    }
    
    async function displayMessage(message, key) {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        const isOwn = message.userId === currentUser.id;
        messageDiv.className = `message ${isOwn ? 'sent' : 'received'} ${message.type !== 'text' ? 'media-message' : ''}`;
        messageDiv.setAttribute('data-key', key);
        
        let timeStr = 'только что';
        if (message.timestamp) {
            const date = new Date(message.timestamp);
            timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        let userRole = '';
        const roleSnapshot = await userRolesRef.child(message.userId).once('value');
        if (roleSnapshot.exists()) {
            const roleId = roleSnapshot.val();
            const roleData = await rolesRef.child(roleId).once('value');
            if (roleData.exists()) {
                userRole = `<span class="role-badge" style="background: ${roleData.val().color};">${roleData.val().name}</span>`;
            }
        }
        
        let content = '';
        if (message.type === 'image' || message.type === 'gif') {
            content = `<img src="${escapeHtml(message.text)}" onclick="window.open('${escapeHtml(message.text)}', '_blank')" style="max-width: 300px; max-height: 300px; border-radius: 10px; cursor: pointer;">`;
        } else {
            content = `<div class="message-text">${escapeHtml(message.text)}</div>`;
        }
        
        messageDiv.innerHTML = `
            <div class="message-info">
                <span>${escapeHtml(message.username)}</span>
                ${userRole}
                <span>• ${timeStr}</span>
            </div>
            ${content}
        `;
        
        messagesContainer.appendChild(messageDiv);
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function scrollToBottom() {
        const messagesContainer = document.getElementById('chatMessages');
        if (messagesContainer) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }
    
    function showAdminPanel() {
        if (!isAdmin) {
            Swal.fire('Ошибка', 'У вас нет прав администратора', 'error');
            return;
        }
        document.getElementById('adminModal').style.display = 'block';
        loadAdminData();
    }
    
    async function loadAdminData() {
        await loadUsersList();
        await loadRolesList();
        await loadChannelsList();
    }
    
    async function loadUsersList() {
        const usersList = document.getElementById('usersList');
        usersList.innerHTML = '<div style="color:white;">Загрузка...</div>';
        
        const snapshot = await usersRef.once('value');
        usersList.innerHTML = '';
        
        snapshot.forEach(child => {
            const user = child.val();
            const userDiv = document.createElement('div');
            userDiv.className = 'user-item';
            userDiv.innerHTML = `
                <span>${escapeHtml(user.username)} ${user.username === ADMIN_USERNAME ? '👑' : ''}</span>
                <div>
                    <button class="ban-btn" onclick="banUser('${child.key}', '${escapeHtml(user.username)}')">Забанить</button>
                    <button class="mute-btn" onclick="muteUser('${child.key}', '${escapeHtml(user.username)}')">Мут</button>
                    <button class="edit-btn" onclick="assignRole('${child.key}', '${escapeHtml(user.username)}')">Роль</button>
                </div>
            `;
            usersList.appendChild(userDiv);
        });
    }
    
    async function loadRolesList() {
        const rolesList = document.getElementById('rolesList');
        rolesList.innerHTML = '<div style="color:white;">Загрузка...</div>';
        
        const snapshot = await rolesRef.once('value');
        rolesList.innerHTML = '';
        
        snapshot.forEach(child => {
            const role = child.val();
            const roleDiv = document.createElement('div');
            roleDiv.className = 'role-item';
            roleDiv.innerHTML = `
                <span style="color: ${role.color};">${escapeHtml(role.name)}</span>
                <div>
                    <button class="edit-btn" onclick="editRole('${child.key}', '${escapeHtml(role.name)}', '${role.color}')">✏️</button>
                    <button class="delete-btn" onclick="deleteRole('${child.key}')">🗑️</button>
                </div>
            `;
            rolesList.appendChild(roleDiv);
        });
    }
    
    async function loadChannelsList() {
        const channelsList = document.getElementById('channelsListAdmin');
        channelsList.innerHTML = '<div style="color:white;">Загрузка...</div>';
        
        const snapshot = await channelsRef.once('value');
        channelsList.innerHTML = '';
        
        snapshot.forEach(child => {
            const channel = child.val();
            const channelDiv = document.createElement('div');
            channelDiv.className = 'channel-item-admin';
            channelDiv.innerHTML = `
                <span># ${escapeHtml(channel.displayName || channel.name)}</span>
                <div>
                    <button class="edit-btn" onclick="editChannel('${child.key}', '${escapeHtml(channel.displayName || channel.name)}')">✏️</button>
                    <button class="delete-btn" onclick="deleteChannel('${child.key}')">🗑️</button>
                </div>
            `;
            channelsList.appendChild(channelDiv);
        });
    }
    
    async function banUser(userId, username) {
        const { value: duration } = await Swal.fire({
            title: `Забанить ${username}`,
            input: 'select',
            inputOptions: {
                'permanent': 'Навсегда',
                '3600000': '1 час',
                '86400000': '1 день',
                '604800000': '1 неделя'
            },
            showCancelButton: true
        });
        
        if (duration) {
            const banData = {
                userId: userId,
                username: username,
                bannedBy: currentUser.username,
                timestamp: Date.now(),
                expiresAt: duration === 'permanent' ? null : Date.now() + parseInt(duration)
            };
            await bansRef.child(userId).set(banData);
            Swal.fire('Успех', `${username} забанен`, 'success');
        }
    }
    
    async function muteUser(userId, username) {
        const { value: duration } = await Swal.fire({
            title: `Замутить ${username}`,
            input: 'select',
            inputOptions: {
                '600000': '10 минут',
                '3600000': '1 час',
                '86400000': '1 день'
            },
            showCancelButton: true
        });
        
        if (duration) {
            const muteData = {
                userId: userId,
                username: username,
                mutedBy: currentUser.username,
                timestamp: Date.now(),
                expiresAt: Date.now() + parseInt(duration)
            };
            await mutesRef.child(userId).set(muteData);
            Swal.fire('Успех', `${username} замучен`, 'success');
        }
    }
    
    async function assignRole(userId, username) {
        const rolesSnapshot = await rolesRef.once('value');
        const roles = [];
        rolesSnapshot.forEach(child => {
            roles.push({ id: child.key, name: child.val().name });
        });
        
        if (roles.length === 0) {
            Swal.fire('Ошибка', 'Сначала создайте роли', 'error');
            return;
        }
        
        const { value: roleId } = await Swal.fire({
            title: `Выдать роль для ${username}`,
            input: 'select',
            inputOptions: Object.fromEntries(roles.map(r => [r.id, r.name])),
            showCancelButton: true
        });
        
        if (roleId) {
            await userRolesRef.child(userId).set(roleId);
            Swal.fire('Успех', `Роль выдана`, 'success');
        }
    }
    
    function createRole() {
        Swal.fire({
            title: 'Создать роль',
            html: `
                <input id="roleName" class="swal2-input" placeholder="Название роли">
                <input id="roleColor" class="swal2-input" type="color" value="#667eea">
            `,
            showCancelButton: true,
            preConfirm: () => {
                const name = document.getElementById('roleName').value;
                const color = document.getElementById('roleColor').value;
                if (!name) {
                    Swal.showValidationMessage('Введите название роли');
                }
                return { name, color };
            }
        }).then(async (result) => {
            if (result.value) {
                await rolesRef.push({
                    name: result.value.name,
                    color: result.value.color,
                    createdBy: currentUser.username,
                    createdAt: Date.now()
                });
                Swal.fire('Успех', 'Роль создана', 'success');
                loadRolesList();
            }
        });
    }
    
    async function editRole(roleId, oldName, oldColor) {
        const { value: formValues } = await Swal.fire({
            title: 'Редактировать роль',
            html: `
                <input id="roleName" class="swal2-input" value="${oldName}">
                <input id="roleColor" class="swal2-input" type="color" value="${oldColor}">
            `,
            showCancelButton: true,
            preConfirm: () => {
                const name = document.getElementById('roleName').value;
                const color = document.getElementById('roleColor').value;
                return { name, color };
            }
        });
        
        if (formValues) {
            await rolesRef.child(roleId).update({
                name: formValues.name,
                color: formValues.color
            });
            Swal.fire('Успех', 'Роль обновлена', 'success');
            loadRolesList();
        }
    }
    
    async function deleteRole(roleId) {
        const result = await Swal.fire({
            title: 'Удалить роль?',
            text: 'Это действие нельзя отменить',
            icon: 'warning',
            showCancelButton: true
        });
        
        if (result.isConfirmed) {
            await rolesRef.child(roleId).remove();
            Swal.fire('Удалено', 'Роль удалена', 'success');
            loadRolesList();
        }
    }
    
    function createChannel() {
        Swal.fire({
            title: 'Создать канал',
            input: 'text',
            inputPlaceholder: 'Название канала',
            showCancelButton: true
        }).then(async (result) => {
            if (result.value) {
                const channelName = result.value.toLowerCase().replace(/\s/g, '-');
                await channelsRef.push({
                    name: channelName,
                    displayName: result.value,
                    createdBy: currentUser.username,
                    createdAt: Date.now()
                });
                Swal.fire('Успех', `Канал #${result.value} создан`, 'success');
                loadChannelsList();
                loadChannelsSidebar();
            }
        });
    }
    
    async function editChannel(channelId, oldName) {
        const { value: newName } = await Swal.fire({
            title: 'Редактировать канал',
            input: 'text',
            inputValue: oldName,
            showCancelButton: true
        });
        
        if (newName) {
            await channelsRef.child(channelId).update({
                name: newName.toLowerCase().replace(/\s/g, '-'),
                displayName: newName
            });
            Swal.fire('Успех', 'Канал обновлен', 'success');
            loadChannelsList();
            loadChannelsSidebar();
            updateChannelName();
        }
    }
    
    async function deleteChannel(channelId) {
        const result = await Swal.fire({
            title: 'Удалить канал?',
            text: 'Все сообщения в канале будут удалены',
            icon: 'warning',
            showCancelButton: true
        });
        
        if (result.isConfirmed) {
            await channelsRef.child(channelId).remove();
            await messagesRef.child(channelId).remove();
            Swal.fire('Удалено', 'Канал удален', 'success');
            loadChannelsList();
            loadChannelsSidebar();
            
            const snapshot = await channelsRef.once('value');
            if (snapshot.numChildren() > 0) {
                snapshot.forEach(child => {
                    if (!currentChannel || currentChannel === channelId) {
                        switchChannel(child.key);
                    }
                });
            }
        }
    }
    
    function logout() {
        currentUser = null;
        localStorage.removeItem('chatUser');
        renderAuthScreen();
    }
    
    function renderMainApp() {
        const appDiv = document.getElementById('app');
        appDiv.innerHTML = `
            <div class="app-container">
                <div class="channels-sidebar">
                    <div class="channels-header">📢 Каналы</div>
                    <div class="channels-list" id="channelsList"></div>
                    ${isAdmin ? '<div class="add-channel-btn" onclick="createChannel()">+ Создать канал</div>' : ''}
                </div>
                
                <div class="main-container">
                    <div class="chat-header">
                        <div class="channel-info">
                            <h2 id="channelName"># Загрузка...</h2>
                            <p>Общий чат</p>
                        </div>
                        <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="bottom-panel">
                        ${isAdmin ? '<button class="admin-btn" onclick="showAdminPanel()">⚙️ Админ панель</button>' : ''}
                        <div class="message-input-wrapper">
                            <input type="text" id="messageInput" placeholder="Введите сообщение...">
                            <div class="media-buttons">
                                <button class="media-btn" onclick="sendMessageWithMedia(\'image\')">🖼️</button>
                                <button class="media-btn" onclick="sendMessageWithMedia(\'gif\')">🎬</button>
                            </div>
                            <button id="sendButton" onclick="sendMessage(document.getElementById(\'messageInput\').value)">📤 Отправить</button>
                        </div>
                    </div>
                </div>
                
                <div class="members-sidebar">
                    <div class="members-header">👥 Участники</div>
                    <div class="members-list" id="membersList"></div>
                    <div class="status-text">Status: Work</div>
                </div>
            </div>
            
            <div id="adminModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Админ панель</h2>
                        <button class="close-modal" onclick="document.getElementById('adminModal').style.display='none'">×</button>
                    </div>
                    <div class="admin-tabs">
                        <div class="admin-tab active" onclick="switchAdminTab('users')">Пользователи</div>
                        <div class="admin-tab" onclick="switchAdminTab('roles')">Роли</div>
                        <div class="admin-tab" onclick="switchAdminTab('channels')">Каналы</div>
                    </div>
                    <div id="usersPanel" class="admin-panel active">
                        <div class="user-list" id="usersList"></div>
                    </div>
                    <div id="rolesPanel" class="admin-panel">
                        <button class="add-channel-btn" onclick="createRole()">+ Создать роль</button>
                        <div class="role-list" id="rolesList"></div>
                    </div>
                    <div id="channelsPanel" class="admin-panel">
                        <div class="channel-list" id="channelsListAdmin"></div>
                    </div>
                </div>
            </div>
        `;
        
        loadChannelsSidebar();
        loadMembers();
        listenForMessages();
        
        const messageInput = document.getElementById('messageInput');
        if (messageInput) {
            messageInput.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    sendMessage(messageInput.value);
                }
            };
        }
    }
    
    function renderAuthScreen() {
        const appDiv = document.getElementById('app');
        appDiv.innerHTML = `
            <div class="auth-overlay">
                <div class="auth-container">
                    <div class="auth-title" id="authTitle">Регистрация</div>
                    <input type="text" id="username" class="auth-input" placeholder="Никнейм">
                    <input type="password" id="password" class="auth-input" placeholder="Пароль">
                    <div id="errorMessage" class="error-message"></div>
                    <button class="auth-button" id="submitButton">Зарегистрироваться</button>
                    <div class="auth-switch" id="authSwitch">Уже есть аккаунт? Войти</div>
                </div>
            </div>
        `;
        
        let isLoginMode = false;
        
        document.getElementById('submitButton').onclick = () => submitAuth(isLoginMode);
        document.getElementById('authSwitch').onclick = () => {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const submitBtn = document.getElementById('submitButton');
            const switchBtn = document.getElementById('authSwitch');
            
            if (isLoginMode) {
                title.textContent = 'Вход';
                submitBtn.textContent = 'Войти';
                switchBtn.textContent = 'Нет аккаунта? Зарегистрироваться';
            } else {
                title.textContent = 'Регистрация';
                submitBtn.textContent = 'Зарегистрироваться';
                switchBtn.textContent = 'Уже есть аккаунт? Войти';
            }
            document.getElementById('errorMessage').textContent = '';
        };
    }
    
    async function submitAuth(isLoginMode) {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorElement = document.getElementById('errorMessage');
        const submitButton = document.getElementById('submitButton');
        
        if (!username || !password) {
            errorElement.textContent = 'Заполните все поля';
            return;
        }
        
        if (username.length < 3) {
            errorElement.textContent = 'Никнейм должен содержать минимум 3 символа';
            return;
        }
        
        submitButton.disabled = true;
        submitButton.textContent = 'Проверка...';
        errorElement.textContent = '';
        
        try {
            if (isLoginMode) {
                const userSnapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
                
                if (!userSnapshot.exists()) {
                    errorElement.textContent = 'Пользователь не найден';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Войти';
                    return;
                }
                
                let userFound = false;
                userSnapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if (data.password === password) {
                        userFound = true;
                        currentUser = {
                            id: childSnapshot.key,
                            username: data.username
                        };
                    }
                });
                
                if (userFound) {
                    const isBanned = await bansRef.child(currentUser.id).once('value');
                    if (isBanned.exists()) {
                        const banData = isBanned.val();
                        if (!banData.expiresAt || banData.expiresAt > Date.now()) {
                            errorElement.textContent = 'Вы забанены на этом сервере';
                            submitButton.disabled = false;
                            submitButton.textContent = 'Войти';
                            return;
                        } else {
                            await bansRef.child(currentUser.id).remove();
                        }
                    }
                    
                    localStorage.setItem('chatUser', JSON.stringify(currentUser));
                    isAdmin = currentUser.username === ADMIN_USERNAME;
                    renderMainApp();
                } else {
                    errorElement.textContent = 'Неверный пароль';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Войти';
                }
            } else {
                const existingUser = await usersRef.orderByChild('username').equalTo(username).once('value');
                
                if (existingUser.exists()) {
                    errorElement.textContent = 'Этот никнейм уже занят';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Зарегистрироваться';
                    return;
                }
                
                const newUserRef = usersRef.push();
                await newUserRef.set({
                    username: username,
                    password: password,
                    createdAt: Date.now()
                });
                
                currentUser = {
                    id: newUserRef.key,
                    username: username
                };
                localStorage.setItem('chatUser', JSON.stringify(currentUser));
                isAdmin = currentUser.username === ADMIN_USERNAME;
                renderMainApp();
            }
        } catch (error) {
            errorElement.textContent = 'Ошибка: ' + (error.message || 'Неизвестная ошибка');
            submitButton.disabled = false;
            submitButton.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        }
    }
    
    function switchAdminTab(tab) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        
        if (tab === 'users') {
            document.querySelector('.admin-tab:first-child').classList.add('active');
            document.getElementById('usersPanel').classList.add('active');
        } else if (tab === 'roles') {
            document.querySelector('.admin-tab:nth-child(2)').classList.add('active');
            document.getElementById('rolesPanel').classList.add('active');
        } else if (tab === 'channels') {
            document.querySelector('.admin-tab:nth-child(3)').classList.add('active');
            document.getElementById('channelsPanel').classList.add('active');
        }
    }
    
    window.banUser = banUser;
    window.muteUser = muteUser;
    window.assignRole = assignRole;
    window.createRole = createRole;
    window.editRole = editRole;
    window.deleteRole = deleteRole;
    window.createChannel = createChannel;
    window.editChannel = editChannel;
    window.deleteChannel = deleteChannel;
    window.showAdminPanel = showAdminPanel;
    window.sendMessageWithMedia = sendMessageWithMedia;
    window.sendMessage = sendMessage;
    window.switchAdminTab = switchAdminTab;
    window.logout = logout;
    
    async function init() {
        const savedUser = localStorage.getItem('chatUser');
        if (savedUser) {
            try {
                const userData = JSON.parse(savedUser);
                const userCheck = await usersRef.child(userData.id).once('value');
                if (userCheck.exists()) {
                    currentUser = {
                        id: userData.id,
                        username: userData.username
                    };
                    
                    const isBanned = await bansRef.child(currentUser.id).once('value');
                    if (isBanned.exists()) {
                        const banData = isBanned.val();
                        if (!banData.expiresAt || banData.expiresAt > Date.now()) {
                            localStorage.removeItem('chatUser');
                            renderAuthScreen();
                            return;
                        } else {
                            await bansRef.child(currentUser.id).remove();
                        }
                    }
                    
                    isAdmin = currentUser.username === ADMIN_USERNAME;
                    renderMainApp();
                    return;
                }
            } catch (error) {
                console.error('Auto login error:', error);
            }
        }
        
        renderAuthScreen();
    }
    
    init();
</script>
