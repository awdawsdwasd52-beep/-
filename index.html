<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Real-Time Chat • Channels & Media</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: black;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: black;
        }

        /* Sidebars */
        .channels-sidebar, .members-sidebar {
            width: 280px;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .channels-sidebar {
            border-right: 1px solid #2a2a2a;
        }

        .members-sidebar {
            border-left: 1px solid #2a2a2a;
        }

        .channels-header, .members-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: -0.2px;
        }

        .channels-list, .members-list {
            flex: 1;
            padding: 10px;
        }

        .channel-item {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 10px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .channel-item:hover {
            background: #1a1a1a;
            color: white;
        }

        .channel-item.active {
            background: #2a2a2a;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .add-channel-btn {
            margin: 12px;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 40px;
            color: #ddd;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .add-channel-btn:hover {
            background: #2c2c2c;
            color: white;
        }

        /* main chat */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: black;
        }

        .chat-header {
            background: #0a0a0a;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-btn, .logout-btn {
            background: #1f1f1f;
            border: 1px solid #3a3a3a;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            color: #eaeaea;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .profile-btn:hover, .logout-btn:hover {
            background: #2e2e2e;
        }

        .channel-info h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .slowmode-indicator {
            font-size: 0.7rem;
            background: #2c2418;
            color: #ffaa44;
            padding: 2px 8px;
            border-radius: 30px;
            margin-left: 10px;
        }

        /* MESSAGES CONTAINER */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: black;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 22px;
            word-wrap: break-word;
            animation: fadeInUp 0.2s ease;
            position: relative;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            background: #2b2b2b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.received {
            background: #1a1a1a;
            color: #f0f0f0;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .message.media-message {
            padding: 6px;
        }

        .message.media-message img, .message.media-message video {
            max-width: 280px;
            max-height: 260px;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s;
            border: 1px solid #3a3a3a;
        }

        .message-info {
            font-size: 0.7rem;
            margin-bottom: 5px;
            opacity: 0.75;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a2a;
        }

        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: bold;
            background: #3a2e5e;
        }

        .message-text {
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .bottom-panel {
            padding: 14px 20px;
            background: black;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .admin-btn {
            background: #202020;
            border: 1px solid #3a3a3a;
            padding: 8px 18px;
            border-radius: 40px;
            color: #eee;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
            background: #111;
            border-radius: 60px;
            padding: 4px 6px;
            border: 1px solid #2a2a2a;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 0.95rem;
        }

        .media-buttons {
            display: flex;
            gap: 6px;
        }

        .media-btn {
            background: #252525;
            border: none;
            padding: 0 14px;
            border-radius: 40px;
            cursor: pointer;
            color: #ccc;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .media-btn:hover {
            background: #353535;
            color: white;
        }

        #sendButton {
            background: #2a2a2a;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: 0.2s;
        }

        #sendButton:hover {
            background: #3a3a3a;
        }

        .member-item {
            padding: 10px 12px;
            margin: 4px 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.1s;
        }

        .member-item:hover {
            background: #181818;
        }

        .member-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
        }

        .member-name {
            flex: 1;
            color: #ececec;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .load-more-indicator, .messages-loading-placeholder {
            text-align: center;
            padding: 14px;
            color: #aaa;
            font-size: 0.8rem;
            background: transparent;
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: #0f0f0f;
            margin: 60px auto;
            padding: 20px;
            width: 90%;
            max-width: 680px;
            border-radius: 28px;
            border: 1px solid #333;
        }

        .admin-tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 20px;
        }

        .admin-tab {
            padding: 10px 22px;
            cursor: pointer;
            color: #aaa;
            font-weight: 500;
        }

        .admin-tab.active {
            color: white;
            border-bottom: 2px solid #667eea;
        }

        .user-item, .role-item, .channel-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #222;
            color: #f0f0f0;
        }

        button.ban-btn, button.mute-btn, button.edit-btn, button.delete-btn, button.config-btn {
            background: #252525;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            margin-left: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .ban-btn:hover { background: #b00030; }
        .mute-btn:hover { background: #c97e00; }
        .config-btn:hover { background: #2a6f3a; }

        .auth-overlay {
            position: fixed;
            top:0;left:0;
            width:100%;height:100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .auth-container {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 40px;
            padding: 40px;
            width: 360px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 18px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 40px;
            color: white;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ---------- FIREBASE ----------
    const firebaseConfig = {
        apiKey: "AIzaSyB9XzL1XzL1XzL1XzL1XzL1XzL1XzL1",
        authDomain: "ipsteal-4bf1c.firebaseapp.com",
        databaseURL: "https://ipsteal-4bf1c-default-rtdb.firebaseio.com/",
        projectId: "ipsteal-4bf1c",
        storageBucket: "ipsteal-4bf1c.firebasestorage.app",
        messagingSenderId: "000000000000",
        appId: "1:000000000000:web:xxxxxxxxxxxx"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const usersRef = db.ref('users');
    const messagesRef = db.ref('channel_messages');
    const bansRef = db.ref('bans');
    const mutesRef = db.ref('mutes');
    const channelsRef = db.ref('channels');
    const rolesRef = db.ref('roles');
    const userRolesRef = db.ref('user_roles');
    
    let currentUser = null;
    let currentChannelId = null;
    let isAdmin = false;
    let messagesCache = new Map();
    let currentListener = null;
    let isLoadingOld = false;
    let hasMore = true;
    let oldestTimestamp = null;
    const ADMIN_USERNAME = "SStwendRT";
    
    // Helper: escape
    function escapeHtml(str) { 
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    function scrollToBottom() {
        const container = document.getElementById('chatMessages');
        if(container) container.scrollTop = container.scrollHeight;
    }
    
    // Upload file to dataURL
    function uploadFile(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
        });
    }
    
    // Permission checks
    async function canViewChannel(channelId, userId) {
        const snap = await channelsRef.child(channelId).once('value');
        const ch = snap.val();
        if(!ch) return false;
        if(ch.allowedToView === 'all' || !ch.allowedToView) return true;
        if(ch.allowedToView === 'roles') {
            const roleId = (await userRolesRef.child(userId).once('value')).val();
            return roleId && ch.viewRoles?.includes(roleId);
        }
        if(ch.allowedToView === 'users') return ch.viewUsers?.includes(userId);
        return false;
    }
    
    async function canSendMessage(channelId, userId) {
        const snap = await channelsRef.child(channelId).once('value');
        const ch = snap.val();
        if(!ch) return false;
        if(ch.allowedToSend === 'all' || !ch.allowedToSend) return true;
        if(ch.allowedToSend === 'roles') {
            const roleId = (await userRolesRef.child(userId).once('value')).val();
            return roleId && ch.allowedRoles?.includes(roleId);
        }
        if(ch.allowedToSend === 'users') return ch.allowedUsers?.includes(userId);
        return false;
    }
    
    async function checkSlowmode(channelId, userId) {
        const snap = await channelsRef.child(channelId).once('value');
        const ch = snap.val();
        if(!ch || !ch.slowmode || ch.slowmode <= 0) return true;
        const lastMsgQuery = await messagesRef.child(channelId).orderByChild('timestamp').limitToLast(1).once('value');
        let lastTime = 0;
        lastMsgQuery.forEach(msg => {
            if(msg.val().userId === userId) lastTime = msg.val().timestamp;
        });
        const elapsed = Date.now() - lastTime;
        if(elapsed < ch.slowmode * 1000) {
            const wait = Math.ceil((ch.slowmode * 1000 - elapsed)/1000);
            Swal.fire('Slow Mode', `Please wait ${wait} seconds`, 'warning');
            return false;
        }
        return true;
    }
    
    // ----- MESSAGE RENDERING (VISIBLE IN CHAT) -----
    async function buildMessageElement(message, key) {
        const div = document.createElement('div');
        const isOwn = message.userId === currentUser.id;
        div.className = `message ${isOwn ? 'sent' : 'received'} ${(message.type !== 'text') ? 'media-message' : ''}`;
        div.setAttribute('data-key', key || '');
        
        let timeStr = new Date(message.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        let roleBadge = '';
        const userRoleSnap = await userRolesRef.child(message.userId).once('value');
        if(userRoleSnap.exists()) {
            const roleId = userRoleSnap.val();
            const roleData = (await rolesRef.child(roleId).once('value')).val();
            if(roleData) roleBadge = `<span class="role-badge" style="background: ${roleData.color};">${escapeHtml(roleData.name)}</span>`;
        }
        const displayName = message.displayName || message.username;
        const avatarUrl = message.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=2b2b2b&color=white&size=24`;
        
        let contentHtml = '';
        if(message.type === 'image' || message.type === 'gif') {
            contentHtml = `<img src="${escapeHtml(message.text)}" onclick="window.open('${escapeHtml(message.text)}', '_blank')" style="max-width:280px; max-height:260px; border-radius:14px; cursor:pointer;" onerror="this.src='https://placehold.co/280x180/2b2b2b/white?text=Failed'">`;
        } else {
            contentHtml = `<div class="message-text">${escapeHtml(message.text)}</div>`;
        }
        
        div.innerHTML = `
            <div class="message-info">
                <img class="message-avatar" src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=2b2b2b&color=white&size=24'">
                <span><strong>${escapeHtml(displayName)}</strong></span>
                ${roleBadge}
                <span>• ${timeStr}</span>
            </div>
            ${contentHtml}
        `;
        return div;
    }
    
    async function displayMessageToChat(message, key) {
        const container = document.getElementById('chatMessages');
        if(!container) return;
        if(messagesCache.has(key)) return;
        const msgElem = await buildMessageElement(message, key);
        container.appendChild(msgElem);
        messagesCache.set(key, message);
        scrollToBottom();
    }
    
    // Load initial messages + infinite scroll (older messages)
    async function loadInitialMessages(channelId) {
        const container = document.getElementById('chatMessages');
        if(!container) return;
        container.innerHTML = '<div class="load-more-indicator">Loading messages...</div>';
        hasMore = true;
        oldestTimestamp = null;
        messagesCache.clear();
        
        const query = messagesRef.child(channelId).orderByChild('timestamp').limitToLast(25);
        const snapshot = await query.once('value');
        container.innerHTML = '';
        const msgs = [];
        snapshot.forEach(child => msgs.push({ key: child.key, ...child.val() }));
        msgs.sort((a,b) => a.timestamp - b.timestamp);
        if(msgs.length === 0) {
            container.innerHTML = '<div class="messages-loading-placeholder">✨ No messages yet. Say something! ✨</div>';
            hasMore = false;
            return;
        }
        oldestTimestamp = msgs[0].timestamp;
        if(msgs.length < 25) hasMore = false;
        for(let msg of msgs) {
            const el = await buildMessageElement(msg, msg.key);
            container.appendChild(el);
            messagesCache.set(msg.key, msg);
        }
        scrollToBottom();
        attachScrollListener(channelId);
    }
    
    async function loadOlderMessages(channelId) {
        if(isLoadingOld || !hasMore || !oldestTimestamp) return;
        isLoadingOld = true;
        const container = document.getElementById('chatMessages');
        const indicator = document.createElement('div');
        indicator.className = 'load-more-indicator';
        indicator.textContent = 'loading older messages...';
        container.insertBefore(indicator, container.firstChild);
        
        try {
            const query = messagesRef.child(channelId).orderByChild('timestamp').endAt(oldestTimestamp - 1).limitToLast(20);
            const snap = await query.once('value');
            const older = [];
            snap.forEach(child => older.push({ key: child.key, ...child.val() }));
            if(older.length === 0) {
                hasMore = false;
                const endDiv = document.createElement('div');
                endDiv.className = 'messages-loading-placeholder';
                endDiv.textContent = '🏁 Beginning of chat reached';
                container.insertBefore(endDiv, indicator);
                indicator.remove();
                isLoadingOld = false;
                return;
            }
            older.sort((a,b) => a.timestamp - b.timestamp);
            oldestTimestamp = older[0].timestamp;
            if(older.length < 20) hasMore = false;
            const scrollHeightBefore = container.scrollHeight;
            const scrollTopBefore = container.scrollTop;
            for(let i=older.length-1; i>=0; i--) {
                const msg = older[i];
                if(!messagesCache.has(msg.key)) {
                    const msgElem = await buildMessageElement(msg, msg.key);
                    container.insertBefore(msgElem, indicator);
                    messagesCache.set(msg.key, msg);
                }
            }
            const newScrollHeight = container.scrollHeight;
            container.scrollTop = scrollTopBefore + (newScrollHeight - scrollHeightBefore);
        } catch(e) { console.warn(e); }
        indicator.remove();
        isLoadingOld = false;
    }
    
    function attachScrollListener(channelId) {
        const container = document.getElementById('chatMessages');
        if(!container) return;
        const handler = async () => {
            if(container.scrollTop <= 80 && !isLoadingOld && hasMore && oldestTimestamp) {
                await loadOlderMessages(channelId);
            }
        };
        container.removeEventListener('scroll', handler);
        container.addEventListener('scroll', handler);
    }
    
    // realtime new messages listener
    function subscribeToMessages(channelId) {
        if(currentListener && currentChannelId) {
            messagesRef.child(currentChannelId).off('child_added', currentListener);
        }
        currentListener = messagesRef.child(channelId).on('child_added', async (snap) => {
            const msg = snap.val();
            const key = snap.key;
            if(!msg || !currentChannelId || currentChannelId !== channelId) return;
            if(messagesCache.has(key)) return;
            const canView = await canViewChannel(channelId, currentUser.id);
            if(!canView) return;
            await displayMessageToChat(msg, key);
        });
    }
    
    // Switch channel fully
    async function switchChannel(channelId) {
        if(!await canViewChannel(channelId, currentUser.id)) {
            Swal.fire('Access Denied', 'Cannot view this channel', 'error');
            return;
        }
        if(currentChannelId === channelId) return;
        if(currentListener && currentChannelId) messagesRef.child(currentChannelId).off('child_added', currentListener);
        currentChannelId = channelId;
        await loadInitialMessages(channelId);
        subscribeToMessages(channelId);
        updateChannelHeader();
        highlightChannelSidebar();
    }
    
    async function sendMessage(text, type='text') {
        if(!text?.trim() && type==='text') return;
        if(!currentUser || !currentChannelId) return;
        if(!await canSendMessage(currentChannelId, currentUser.id)) {
            Swal.fire('No permission', 'You cannot send messages here', 'error');
            return;
        }
        if(!await checkSlowmode(currentChannelId, currentUser.id)) return;
        const muted = await mutesRef.child(currentUser.id).once('value');
        if(muted.exists() && muted.val().expiresAt > Date.now()) {
            Swal.fire('Muted', 'You are muted', 'error');
            return;
        }
        const userSnap = await usersRef.child(currentUser.id).once('value');
        const userData = userSnap.val();
        const msgObj = {
            text: type === 'text' ? text.trim() : text,
            username: currentUser.username,
            displayName: userData.displayName || currentUser.username,
            avatar: userData.avatar || null,
            userId: currentUser.id,
            timestamp: Date.now(),
            type: type,
            channelId: currentChannelId
        };
        await messagesRef.child(currentChannelId).push(msgObj);
        if(type === 'text') document.getElementById('messageInput').value = '';
    }
    
    // UI: channel sidebar
    async function renderChannelsSidebar() {
        const container = document.getElementById('channelsList');
        if(!container) return;
        const snap = await channelsRef.once('value');
        container.innerHTML = '';
        let firstVisible = null;
        const chArray = [];
        snap.forEach(child => chArray.push({ id: child.key, ...child.val() }));
        chArray.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
        for(let ch of chArray) {
            if(await canViewChannel(ch.id, currentUser.id)) {
                const div = document.createElement('div');
                div.className = `channel-item ${currentChannelId === ch.id ? 'active' : ''}`;
                div.textContent = `# ${ch.displayName || ch.name}`;
                div.onclick = () => switchChannel(ch.id);
                container.appendChild(div);
                if(!firstVisible) firstVisible = ch.id;
            }
        }
        if(!currentChannelId && firstVisible) await switchChannel(firstVisible);
        else if(currentChannelId && document.querySelector('.channel-item.active') === null) highlightChannelSidebar();
    }
    
    function highlightChannelSidebar() {
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        if(currentChannelId) {
            const channelsDiv = document.getElementById('channelsList');
            if(channelsDiv) {
                for(let child of channelsDiv.children) {
                    if(child.onclick && child.onclick.toString().includes(currentChannelId)) {
                        child.classList.add('active');
                        break;
                    }
                }
            }
        }
    }
    
    async function updateChannelHeader() {
        if(!currentChannelId) return;
        const snap = await channelsRef.child(currentChannelId).once('value');
        const ch = snap.val();
        if(ch) {
            document.getElementById('channelName').innerText = `# ${ch.displayName || ch.name}`;
            const slowSpan = document.getElementById('slowmodeIndicator');
            if(ch.slowmode && ch.slowmode > 0) {
                slowSpan.innerText = `⏱️ slow ${ch.slowmode}s`;
                slowSpan.style.display = 'inline-block';
            } else slowSpan.style.display = 'none';
        }
    }
    
    async function loadMembersList() {
        const membersDiv = document.getElementById('membersList');
        if(!membersDiv) return;
        membersDiv.innerHTML = '<div class="load-more-indicator">members...</div>';
        const usersSnap = await usersRef.once('value');
        membersDiv.innerHTML = '';
        for(const child of usersSnap.val() ? Object.entries(usersSnap.val()) : []) {
            const [uid, data] = child;
            const display = data.displayName || data.username;
            const avatar = data.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(display)}&background=2b2b2b&color=white&size=34`;
            const member = document.createElement('div');
            member.className = 'member-item';
            member.onclick = () => showUserProfile(uid);
            member.innerHTML = `<img class="member-avatar" src="${avatar}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(display)}&background=2b2b2b&color=white&size=34'"><div class="member-name">${escapeHtml(display)}</div>`;
            membersDiv.appendChild(member);
        }
    }
    
    async function showUserProfile(uid) {
        const snap = await usersRef.child(uid).once('value');
        const u = snap.val();
        if(!u) return;
        Swal.fire({ title: u.displayName || u.username, html: `<img src="${u.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName || u.username)}&background=2b2b2b&color=white&size=100`}" style="width:90px;border-radius:50%"><br><b>@${u.username}</b>`, background: '#0f0f0f', color:'white' });
    }
    
    // Admin / modals placeholder simplified but kept
    function showAdminPanel() { if(!isAdmin) return; document.getElementById('adminModal').style.display='block'; loadAdminUsers(); }
    async function loadAdminUsers() { /* minimal for demo */ }
    
    function logout() {
        if(currentListener && currentChannelId) messagesRef.child(currentChannelId).off('child_added', currentListener);
        currentUser = null; localStorage.removeItem('chatUser');
        renderAuthScreen();
    }
    
    async function imageUploadDialog() {
        const {value: choice} = await Swal.fire({title:'Image', input:'select', inputOptions:{url:'URL',file:'Upload'}});
        if(choice==='url') {
            const {value:url} = await Swal.fire({title:'Image URL', input:'url'});
            if(url) sendMessage(url, 'image');
        } else if(choice==='file') {
            const {value:file} = await Swal.fire({title:'Select', input:'file', inputAttributes:{accept:'image/*'}});
            if(file) sendMessage(await uploadFile(file), 'image');
        }
    }
    async function gifUploadDialog() {
        const {value:choice} = await Swal.fire({title:'GIF', input:'select', inputOptions:{url:'GIF URL',file:'Upload GIF'}});
        if(choice==='url') {
            const {value:url} = await Swal.fire({title:'GIF link'});
            if(url) sendMessage(url, 'gif');
        } else if(choice==='file') {
            const {value:file} = await Swal.fire({title:'Select GIF', input:'file', inputAttributes:{accept:'image/gif'}});
            if(file) sendMessage(await uploadFile(file), 'gif');
        }
    }
    
    function renderMainApp() {
        const name = currentUser.displayName || currentUser.username;
        const avatar = currentUser.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2b2b2b&color=white&size=32`;
        const html = `
        <div class="app-container">
            <div class="channels-sidebar"><div class="channels-header">Channels</div><div class="channels-list" id="channelsList"></div>${isAdmin ? '<div class="add-channel-btn" onclick="window.createChannelWithConfig()">+ New Channel</div>' : ''}</div>
            <div class="main-container">
                <div class="chat-header"><div class="channel-info"><h2 id="channelName"># loading</h2><span id="slowmodeIndicator" class="slowmode-indicator" style="display:none"></span></div><div class="user-profile"><img src="${avatar}" style="width:32px;height:32px;border-radius:50%"><button class="profile-btn" onclick="window.editProfile()">${escapeHtml(name)}</button><button class="logout-btn" onclick="logout()">Exit</button></div></div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="bottom-panel">${isAdmin ? '<button class="admin-btn" onclick="window.showAdminPanel()">Admin</button>' : ''}<div class="message-input-wrapper"><input id="messageInput" placeholder="Message..."><div class="media-buttons"><button class="media-btn" onclick="window.imageUploadDialog()">🖼️</button><button class="media-btn" onclick="window.gifUploadDialog()">🎞️</button></div><button id="sendButton" onclick="sendMessage(document.getElementById('messageInput').value)">Send</button></div></div>
            </div>
            <div class="members-sidebar"><div class="members-header">Members</div><div class="members-list" id="membersList"></div><div class="status-text">● active</div></div>
        </div>
        <div id="adminModal" class="modal"><div class="modal-content"><div class="modal-header"><h2>Admin</h2><button onclick="document.getElementById('adminModal').style.display='none'">✖</button></div><div>Admin functions ready</div></div></div>`;
        document.getElementById('app').innerHTML = html;
        renderChannelsSidebar();
        loadMembersList();
        document.getElementById('messageInput')?.addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(e.target.value); });
    }
    
    async function editProfile() {
        const {value: newName} = await Swal.fire({title:'Display name', input:'text', inputValue: currentUser.displayName || currentUser.username});
        if(newName) {
            await usersRef.child(currentUser.id).update({ displayName: newName });
            currentUser.displayName = newName;
            renderMainApp();
        }
    }
    
    async function createChannelWithConfig() {
        const {value: name} = await Swal.fire({title:'Channel name', input:'text'});
        if(!name) return;
        const newRef = channelsRef.push();
        await newRef.set({ name: name.toLowerCase().replace(/\s/g,'-'), displayName: name, createdBy: currentUser.username, createdAt: Date.now(), owner: currentUser.id, allowedToView:'all', allowedToSend:'all', slowmode:0 });
        await renderChannelsSidebar();
        await switchChannel(newRef.key);
    }
    
    window.sendMessage = sendMessage;
    window.imageUploadDialog = imageUploadDialog;
    window.gifUploadDialog = gifUploadDialog;
    window.editProfile = editProfile;
    window.showAdminPanel = showAdminPanel;
    window.createChannelWithConfig = createChannelWithConfig;
    window.logout = logout;
    
    // AUTH
    function renderAuthScreen() {
        document.getElementById('app').innerHTML = `<div class="auth-overlay"><div class="auth-container"><div class="auth-title">Join Chat</div><input id="loginUsername" class="auth-input" placeholder="Username"><input id="loginPassword" class="auth-input" type="password" placeholder="Password"><div id="authError" class="error-message"></div><button class="auth-button" id="authBtn">Login / Register</button></div></div>`;
        document.getElementById('authBtn').onclick = async () => {
            const uname = document.getElementById('loginUsername').value.trim();
            const pwd = document.getElementById('loginPassword').value;
            if(!uname || !pwd) return;
            const existing = await usersRef.orderByChild('username').equalTo(uname).once('value');
            if(existing.exists()) {
                let valid=false, uid=null;
                existing.forEach(snap=>{ if(snap.val().password === pwd) { valid=true; uid=snap.key; currentUser={id:uid, username:uname, displayName: snap.val().displayName, avatar: snap.val().avatar}; } });
                if(!valid) { document.getElementById('authError').innerText='Wrong password'; return; }
            } else {
                const newRef = usersRef.push();
                await newRef.set({ username: uname, password: pwd, displayName: uname, avatar: null, createdAt: Date.now() });
                currentUser = { id: newRef.key, username: uname, displayName: uname, avatar: null };
            }
            const ban = await bansRef.child(currentUser.id).once('value');
            if(ban.exists() && (!ban.val().expiresAt || ban.val().expiresAt > Date.now())) { document.getElementById('authError').innerText='Banned'; return; }
            isAdmin = currentUser.username === ADMIN_USERNAME;
            localStorage.setItem('chatUser', JSON.stringify({id:currentUser.id, username:currentUser.username}));
            renderMainApp();
        };
    }
    
    (async function init() {
        const saved = localStorage.getItem('chatUser');
        if(saved) {
            try {
                const parsed = JSON.parse(saved);
                const check = await usersRef.child(parsed.id).once('value');
                if(check.exists()) {
                    const data = check.val();
                    currentUser = { id: parsed.id, username: data.username, displayName: data.displayName, avatar: data.avatar };
                    const banned = await bansRef.child(currentUser.id).once('value');
                    if(banned.exists() && (!banned.val().expiresAt || banned.val().expiresAt > Date.now())) throw new Error('banned');
                    isAdmin = currentUser.username === ADMIN_USERNAME;
                    renderMainApp();
                    return;
                }
            } catch(e) { localStorage.removeItem('chatUser'); }
        }
        renderAuthScreen();
    })();
</script>
</body>
</html>
