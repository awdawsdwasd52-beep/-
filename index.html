<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>General Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: black;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        .chat-header {
            background: #0a0a0a;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid #2a2a2a;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: black;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            background: #2b2b2b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #1a1a1a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            font-size: 0.7rem;
            margin-bottom: 4px;
            opacity: 0.7;
            color: #888;
        }

        .chat-input-area {
            padding: 20px;
            background: black;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #2a2a2a;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
            background: #1a1a1a;
            color: white;
        }

        #messageInput:focus {
            border-color: #4a4a4a;
            background: #222;
        }

        #messageInput::placeholder {
            color: #666;
        }

        #sendButton {
            background: #2b2b2b;
            color: white;
            border: 1px solid #3a3a3a;
            padding: 0 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #sendButton:hover {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }

        #sendButton:active {
            transform: scale(0.97);
        }

        .status {
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            background: #0a0a0a;
            border-top: 1px solid #2a2a2a;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-container {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
        }

        .auth-title {
            color: white;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .auth-input:focus {
            border-color: #4a4a4a;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .auth-button:hover {
            background: #3a3a3a;
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-switch {
            text-align: center;
            color: #888;
            cursor: pointer;
            margin-top: 20px;
        }

        .auth-switch:hover {
            color: white;
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .logout-button {
            background: #2b2b2b;
            color: white;
            border: 1px solid #3a3a3a;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .logout-button:hover {
            background: #3a3a3a;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 85%;
            }
            .chat-container {
                height: 95vh;
            }
            .auth-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="chat-container" id="chatContainer" style="display: none;">
    <div class="chat-header">
        General
        <button class="logout-button" onclick="logout()">Выйти</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
        <button id="sendButton">📤 Отправить</button>
    </div>
    <div class="status" id="statusText">Status: Work</div>
</div>

<div class="auth-overlay" id="authOverlay">
    <div class="auth-container" id="authContainer">
        <div class="auth-title" id="authTitle">Регистрация</div>
        <input type="text" id="username" class="auth-input" placeholder="Никнейм">
        <input type="password" id="password" class="auth-input" placeholder="Пароль">
        <div id="errorMessage" class="error-message"></div>
        <button class="auth-button" id="submitButton" onclick="submitAuth()">Зарегистрироваться</button>
        <div class="auth-switch" onclick="switchMode()">Уже есть аккаунт? Войти</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB9XzL1XzL1XzL1XzL1XzL1XzL1XzL1",
        authDomain: "ipsteal-4bf1c.firebaseapp.com",
        databaseURL: "https://ipsteal-4bf1c-default-rtdb.firebaseio.com/",
        projectId: "ipsteal-4bf1c",
        storageBucket: "ipsteal-4bf1c.firebasestorage.app",
        messagingSenderId: "000000000000",
        appId: "1:000000000000:web:xxxxxxxxxxxx"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const usersRef = database.ref('users');
    const messagesRef = database.ref('chat_messages');
    
    let currentUser = null;
    let isLoginMode = false;
    
    function switchMode() {
        isLoginMode = !isLoginMode;
        const authTitle = document.getElementById('authTitle');
        const submitButton = document.getElementById('submitButton');
        
        if (isLoginMode) {
            authTitle.textContent = 'Вход';
            submitButton.textContent = 'Войти';
            document.querySelector('.auth-switch').textContent = 'Нет аккаунта? Зарегистрироваться';
        } else {
            authTitle.textContent = 'Регистрация';
            submitButton.textContent = 'Зарегистрироваться';
            document.querySelector('.auth-switch').textContent = 'Уже есть аккаунт? Войти';
        }
        
        document.getElementById('errorMessage').textContent = '';
    }
    
    async function submitAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorElement = document.getElementById('errorMessage');
        const submitButton = document.getElementById('submitButton');
        
        if (!username || !password) {
            errorElement.textContent = 'Заполните все поля';
            return;
        }
        
        if (username.length < 3) {
            errorElement.textContent = 'Никнейм должен содержать минимум 3 символа';
            return;
        }
        
        if (password.length < 4) {
            errorElement.textContent = 'Пароль должен содержать минимум 4 символа';
            return;
        }
        
        submitButton.disabled = true;
        submitButton.textContent = 'Проверка...';
        errorElement.textContent = '';
        
        try {
            if (isLoginMode) {
                const userSnapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
                
                if (!userSnapshot.exists()) {
                    errorElement.textContent = 'Пользователь не найден';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Войти';
                    return;
                }
                
                let userFound = false;
                let userData = null;
                let userId = null;
                
                userSnapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if (data.password === password) {
                        userFound = true;
                        userData = data;
                        userId = childSnapshot.key;
                    }
                });
                
                if (userFound) {
                    currentUser = {
                        id: userId,
                        username: userData.username
                    };
                    loginSuccess();
                } else {
                    errorElement.textContent = 'Неверный пароль';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Войти';
                }
            } else {
                const existingUser = await usersRef.orderByChild('username').equalTo(username).once('value');
                
                if (existingUser.exists()) {
                    errorElement.textContent = 'Этот никнейм уже занят';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Зарегистрироваться';
                    return;
                }
                
                const newUserRef = usersRef.push();
                await newUserRef.set({
                    username: username,
                    password: password,
                    createdAt: Date.now()
                });
                
                currentUser = {
                    id: newUserRef.key,
                    username: username
                };
                
                loginSuccess();
            }
        } catch (error) {
            console.error('Auth error:', error);
            if (error.code === 'PERMISSION_DENIED') {
                errorElement.textContent = 'Ошибка доступа к базе данных. Проверьте правила безопасности Firebase.';
            } else if (error.message.includes('network')) {
                errorElement.textContent = 'Ошибка соединения. Проверьте интернет и настройки Firebase.';
            } else {
                errorElement.textContent = 'Ошибка: ' + (error.message || 'Неизвестная ошибка');
            }
            submitButton.disabled = false;
            if (isLoginMode) {
                submitButton.textContent = 'Войти';
            } else {
                submitButton.textContent = 'Зарегистрироваться';
            }
        }
    }
    
    function loginSuccess() {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('chatContainer').style.display = 'flex';
        initChat();
        sendIPToFirebase();
    }
    
    function logout() {
        currentUser = null;
        document.getElementById('authOverlay').style.display = 'flex';
        document.getElementById('chatContainer').style.display = 'none';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('errorMessage').textContent = '';
        isLoginMode = false;
        document.getElementById('authTitle').textContent = 'Регистрация';
        const submitButton = document.getElementById('submitButton');
        submitButton.textContent = 'Зарегистрироваться';
        submitButton.disabled = false;
        document.querySelector('.auth-switch').textContent = 'Уже есть аккаунт? Войти';
    }
    
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentUser) return;
        
        const sendBtn = document.getElementById('sendButton');
        sendBtn.disabled = true;
        
        try {
            const message = {
                text: text,
                username: currentUser.username,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                userId: currentUser.id
            };
            
            await messagesRef.push(message);
            input.value = '';
            scrollToBottom();
        } catch (error) {
            console.error('Send error:', error);
            if (error.code === 'PERMISSION_DENIED') {
                document.getElementById('statusText').textContent = 'Status: Error - Нет прав на запись в чат';
            } else {
                document.getElementById('statusText').textContent = 'Status: Error - Не удалось отправить';
            }
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }
    
    function listenForMessages() {
        messagesRef.orderByChild('timestamp').limitToLast(50).on('child_added', (snapshot) => {
            const message = snapshot.val();
            const messageKey = snapshot.key;
            
            const existingMsg = document.querySelector(`.message[data-key="${messageKey}"]`);
            if (existingMsg) return;
            
            displayMessage(message, messageKey);
            scrollToBottom();
        });
        
        messagesRef.on('error', (error) => {
            console.error('Listen error:', error);
            if (error.code === 'PERMISSION_DENIED') {
                document.getElementById('statusText').textContent = 'Status: Error - Нет прав на чтение чата';
            }
        });
    }
    
    function displayMessage(message, key) {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${message.userId === currentUser.id ? 'sent' : 'received'}`;
        messageDiv.setAttribute('data-key', key);
        
        let timeStr = 'только что';
        if (message.timestamp && typeof message.timestamp === 'number') {
            const date = new Date(message.timestamp);
            timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        messageDiv.innerHTML = `
            <div class="message-info">${escapeHtml(message.username)} • ${timeStr}</div>
            <div class="message-text">${escapeHtml(message.text)}</div>
        `;
        
        messagesContainer.appendChild(messageDiv);
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function scrollToBottom() {
        const messagesContainer = document.getElementById('chatMessages');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    async function sendIPToFirebase() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const ip = data.ip;
            const userAgent = navigator.userAgent;
            const timestamp = new Date().toISOString();
            
            const ipLogsRef = database.ref('ip_logs');
            const newIpEntry = ipLogsRef.push();
            await newIpEntry.set({
                ip: ip,
                userAgent: userAgent,
                username: currentUser.username,
                timestamp: timestamp,
                page: window.location.pathname || '/'
            });
            console.log('IP saved:', ip);
        } catch (error) {
            console.error('IP save error:', error);
        }
    }
    
    function initChat() {
        listenForMessages();
        
        const sendBtn = document.getElementById('sendButton');
        const messageInput = document.getElementById('messageInput');
        
        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        };
        
        document.getElementById('statusText').textContent = 'Status: Work';
    }
</script>
</body>
</html>
