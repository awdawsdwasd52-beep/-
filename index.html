<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>General Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: black;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: black;
        }

        .channels-sidebar {
            width: 280px;
            background: #0a0a0a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .channels-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .channels-list {
            flex: 1;
            padding: 10px;
        }

        .channel-item {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
        }

        .channel-item:hover {
            background: #1a1a1a;
            color: white;
        }

        .channel-item.active {
            background: #2b2b2b;
            color: white;
        }

        .add-channel-btn {
            margin: 10px;
            padding: 10px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            text-align: center;
        }

        .add-channel-btn:hover {
            background: #3a3a3a;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0a0a0a;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
        }

        .profile-btn:hover {
            background: #3a3a3a;
        }

        .channel-info h2 {
            font-size: 1.2rem;
        }

        .channel-info p {
            font-size: 0.8rem;
            color: #888;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: black;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        .message.media-message {
            padding: 5px;
        }

        .message.media-message img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            background: #2b2b2b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #1a1a1a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-info {
            font-size: 0.7rem;
            margin-bottom: 4px;
            opacity: 0.7;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .role-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .bottom-panel {
            padding: 15px 20px;
            background: black;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .admin-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .admin-btn:hover {
            background: #3a3a3a;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #2a2a2a;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            background: #1a1a1a;
            color: white;
        }

        #messageInput:focus {
            border-color: #4a4a4a;
        }

        .media-buttons {
            display: flex;
            gap: 5px;
        }

        .media-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 0 15px;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
        }

        .media-btn:hover {
            background: #3a3a3a;
        }

        #sendButton {
            background: #2b2b2b;
            color: white;
            border: 1px solid #3a3a3a;
            padding: 0 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendButton:hover {
            background: #3a3a3a;
        }

        .members-sidebar {
            width: 280px;
            background: #0a0a0a;
            border-left: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .members-header {
            padding: 20px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .members-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .member-item {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .member-item:hover {
            background: #1a1a1a;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .member-name {
            flex: 1;
            color: white;
        }

        .member-role {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-text {
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            background: #0a0a0a;
            border-top: 1px solid #2a2a2a;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content {
            background: #0a0a0a;
            margin: 50px auto;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .profile-preview {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2a2a2a;
        }

        .profile-input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
        }

        .save-profile-btn {
            width: 100%;
            padding: 12px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 20px;
        }

        .admin-tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #888;
        }

        .admin-tab.active {
            color: white;
            border-bottom: 2px solid #667eea;
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .user-list, .role-list, .channel-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item, .role-item, .channel-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #2a2a2a;
            color: white;
        }

        .ban-btn, .mute-btn, .delete-btn, .edit-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
            color: white;
        }

        .ban-btn:hover { background: #ff4444; }
        .mute-btn:hover { background: #ffaa44; }
        
        input, select {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 8px;
            color: white;
            border-radius: 5px;
            margin: 5px 0;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-container {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
        }

        .auth-title {
            color: white;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .auth-switch {
            text-align: center;
            color: #888;
            cursor: pointer;
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            margin-bottom: 15px;
        }

        .logout-btn {
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            font-size: 0.8rem;
        }

        .swal2-popup {
            background: #0a0a0a !important;
            border: 1px solid #2a2a2a !important;
        }
        
        .swal2-title, .swal2-html-container {
            color: white !important;
        }
        
        .swal2-input, .swal2-select {
            background: #1a1a1a !important;
            border: 1px solid #2a2a2a !important;
            color: white !important;
        }
        
        .swal2-confirm, .swal2-cancel {
            background: #2b2b2b !important;
            border: 1px solid #3a3a3a !important;
            color: white !important;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    const ADMIN_USERNAME = "SStwendRT";
    let currentMessagesListener = null;
    let currentChannelId = null;
    
    const firebaseConfig = {
        apiKey: "AIzaSyB9XzL1XzL1XzL1XzL1XzL1XzL1XzL1",
        authDomain: "ipsteal-4bf1c.firebaseapp.com",
        databaseURL: "https://ipsteal-4bf1c-default-rtdb.firebaseio.com/",
        projectId: "ipsteal-4bf1c",
        storageBucket: "ipsteal-4bf1c.firebasestorage.app",
        messagingSenderId: "000000000000",
        appId: "1:000000000000:web:xxxxxxxxxxxx"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const usersRef = database.ref('users');
    const messagesRef = database.ref('channel_messages');
    const bansRef = database.ref('bans');
    const mutesRef = database.ref('mutes');
    const channelsRef = database.ref('channels');
    const rolesRef = database.ref('roles');
    const userRolesRef = database.ref('user_roles');
    
    let currentUser = null;
    let currentChannel = null;
    let isAdmin = false;
    let messagesCache = new Map();
    
    async function loadMembers() {
        const membersList = document.getElementById('membersList');
        if (!membersList) return;
        
        membersList.innerHTML = '<div style="color:#888;">Loading...</div>';
        
        const snapshot = await usersRef.once('value');
        membersList.innerHTML = '';
        
        const users = [];
        snapshot.forEach(child => {
            users.push({
                id: child.key,
                username: child.val().username,
                displayName: child.val().displayName,
                avatar: child.val().avatar
            });
        });
        
        for (const user of users) {
            let roleHtml = '';
            const roleSnapshot = await userRolesRef.child(user.id).once('value');
            if (roleSnapshot.exists()) {
                const roleId = roleSnapshot.val();
                const roleData = await rolesRef.child(roleId).once('value');
                if (roleData.exists()) {
                    roleHtml = `<span class="member-role" style="background: ${roleData.val().color};">${roleData.val().name}</span>`;
                }
            }
            
            const displayName = user.displayName || user.username;
            const avatarUrl = user.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=2b2b2b&color=white&size=32`;
            
            const memberDiv = document.createElement('div');
            memberDiv.className = 'member-item';
            memberDiv.onclick = () => showUserProfile(user.id);
            memberDiv.innerHTML = `
                <img class="member-avatar" src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=2b2b2b&color=white&size=32'">
                <div class="member-name">${escapeHtml(displayName)} ${user.username === ADMIN_USERNAME ? '👑' : ''}</div>
                ${roleHtml}
            `;
            membersList.appendChild(memberDiv);
        }
    }
    
    async function loadChannelsSidebar() {
        const channelsList = document.getElementById('channelsList');
        if (!channelsList) return;
        
        channelsList.innerHTML = '';
        
        const snapshot = await channelsRef.once('value');
        
        if (!snapshot.exists()) {
            const defaultChannel = await channelsRef.push({
                name: 'general',
                displayName: 'General',
                createdBy: 'system',
                createdAt: Date.now()
            });
            currentChannel = defaultChannel.key;
        }
        
        const channels = [];
        snapshot.forEach(child => {
            channels.push({ key: child.key, ...child.val() });
        });
        
        channels.sort((a, b) => a.createdAt - b.createdAt);
        
        channels.forEach(channel => {
            const channelDiv = document.createElement('div');
            channelDiv.className = `channel-item ${currentChannel === channel.key ? 'active' : ''}`;
            channelDiv.textContent = `# ${channel.displayName || channel.name}`;
            channelDiv.onclick = () => switchChannel(channel.key);
            channelsList.appendChild(channelDiv);
        });
        
        if (!currentChannel && channels.length > 0) {
            currentChannel = channels[0].key;
        }
        
        updateChannelName();
    }
    
    function updateChannelName() {
        if (!currentChannel) return;
        channelsRef.child(currentChannel).once('value', (snapshot) => {
            const channel = snapshot.val();
            if (channel) {
                document.getElementById('channelName').textContent = `# ${channel.displayName || channel.name}`;
            }
        });
    }
    
    async function switchChannel(channelId) {
        if (currentChannel === channelId) return;
        
        if (currentMessagesListener) {
            messagesRef.child(currentChannel).off('child_added', currentMessagesListener);
        }
        
        currentChannel = channelId;
        currentChannelId = channelId;
        
        const messagesContainer = document.getElementById('chatMessages');
        messagesContainer.innerHTML = '';
        messagesCache.clear();
        
        loadChannelsSidebar();
        await loadMessagesForChannel(channelId);
        updateChannelName();
    }
    
    async function loadMessagesForChannel(channelId) {
        const messagesContainer = document.getElementById('chatMessages');
        const snapshot = await messagesRef.child(channelId).orderByChild('timestamp').once('value');
        
        const messages = [];
        snapshot.forEach(child => {
            messages.push({ key: child.key, ...child.val() });
        });
        
        messages.sort((a, b) => a.timestamp - b.timestamp);
        
        for (const message of messages) {
            await displayMessage(message, message.key);
            messagesCache.set(message.key, message);
        }
        
        scrollToBottom();
        
        if (currentMessagesListener) {
            messagesRef.child(channelId).off('child_added', currentMessagesListener);
        }
        
        currentMessagesListener = messagesRef.child(channelId).orderByChild('timestamp').startAt(Date.now()).on('child_added', async function(snapshot) {
            const message = snapshot.val();
            const messageKey = snapshot.key;
            
            if (messagesCache.has(messageKey)) return;
            
            await displayMessage(message, messageKey);
            messagesCache.set(messageKey, message);
            scrollToBottom();
        });
    }
    
    async function sendMessageWithMedia(type) {
        const { value: url } = await Swal.fire({
            title: type === 'image' ? 'Insert image URL' : 'Insert GIF URL',
            input: 'url',
            inputPlaceholder: 'https://example.com/image.jpg',
            showCancelButton: true,
            confirmButtonText: 'Send',
            cancelButtonText: 'Cancel',
            background: '#0a0a0a',
            color: 'white'
        });
        
        if (url && isValidUrl(url)) {
            sendMessage(url, type);
        } else if (url) {
            Swal.fire('Error', 'Invalid URL format', 'error');
        }
    }
    
    function isValidUrl(string) {
        try {
            new URL(string);
            return true;
        } catch (_) {
            return false;
        }
    }
    
    async function sendMessage(text, type = 'text') {
        if (!text || !text.trim() || !currentUser || !currentChannel) return;
        
        const isMuted = await mutesRef.child(currentUser.id).once('value');
        if (isMuted.exists()) {
            const muteData = isMuted.val();
            if (muteData.expiresAt > Date.now()) {
                Swal.fire('Error', 'You are muted and cannot send messages', 'error');
                return;
            } else {
                await mutesRef.child(currentUser.id).remove();
            }
        }
        
        const sendBtn = document.getElementById('sendButton');
        sendBtn.disabled = true;
        
        try {
            const userData = await usersRef.child(currentUser.id).once('value');
            const userInfo = userData.val();
            
            const message = {
                text: text.trim(),
                username: currentUser.username,
                displayName: userInfo.displayName || currentUser.username,
                avatar: userInfo.avatar || null,
                userId: currentUser.id,
                timestamp: Date.now(),
                type: type,
                channelId: currentChannel
            };
            
            await messagesRef.child(currentChannel).push(message);
            document.getElementById('messageInput').value = '';
        } catch (error) {
            console.error('Send error:', error);
            Swal.fire('Error', 'Failed to send message', 'error');
        } finally {
            sendBtn.disabled = false;
        }
    }
    
    async function displayMessage(message, key) {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        const isOwn = message.userId === currentUser.id;
        messageDiv.className = `message ${isOwn ? 'sent' : 'received'} ${message.type !== 'text' ? 'media-message' : ''}`;
        messageDiv.setAttribute('data-key', key);
        
        let timeStr = 'just now';
        if (message.timestamp) {
            const date = new Date(message.timestamp);
            timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        let userRole = '';
        const roleSnapshot = await userRolesRef.child(message.userId).once('value');
        if (roleSnapshot.exists()) {
            const roleId = roleSnapshot.val();
            const roleData = await rolesRef.child(roleId).once('value');
            if (roleData.exists()) {
                userRole = `<span class="role-badge" style="background: ${roleData.val().color};">${roleData.val().name}</span>`;
            }
        }
        
        const displayName = message.displayName || message.username;
        const avatarUrl = message.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=2b2b2b&color=white&size=24`;
        
        let content = '';
        if (message.type === 'image') {
            content = `<img src="${escapeHtml(message.text)}" onclick="window.open('${escapeHtml(message.text)}', '_blank')" style="max-width: 300px; max-height: 300px; border-radius: 10px; cursor: pointer;" onerror="this.src='https://placehold.co/300x200/2b2b2b/white?text=Invalid+Image'">`;
        } else if (message.type === 'gif') {
            content = `<img src="${escapeHtml(message.text)}" style="max-width: 300px; max-height: 300px; border-radius: 10px; cursor: pointer;" onclick="window.open('${escapeHtml(message.text)}', '_blank')" onerror="this.src='https://placehold.co/300x200/2b2b2b/white?text=Invalid+GIF'">`;
        } else {
            content = `<div class="message-text">${escapeHtml(message.text)}</div>`;
        }
        
        messageDiv.innerHTML = `
            <div class="message-info">
                <img class="message-avatar" src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=2b2b2b&color=white&size=24'">
                <span>${escapeHtml(displayName)}</span>
                ${userRole}
                <span>• ${timeStr}</span>
            </div>
            ${content}
        `;
        
        messagesContainer.appendChild(messageDiv);
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function scrollToBottom() {
        const messagesContainer = document.getElementById('chatMessages');
        if (messagesContainer) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }
    
    function showProfileModal() {
        Swal.fire({
            title: 'Edit Profile',
            html: `
                <div class="profile-preview">

        });
        
        if (duration) {

    async function submitAuth(isLoginMode) {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorElement = document.getElementById('errorMessage');
        const submitButton = document.getElementById('submitButton');
        
        if (!username || !password) {
            errorElement.textContent = 'Fill in all fields';
            return;
        }
        
        if (username.length < 3) {
            errorElement.textContent = 'Username must be at least 3 characters';
            return;
        }
        
        submitButton.disabled = true;
        submitButton.textContent = 'Checking...';
        errorElement.textContent = '';
        
        try {
            if (isLoginMode) {
                const userSnapshot = await usersRef.orderByChild('username').equalTo(username).once('value');
                
                if (!userSnapshot.exists()) {
                    errorElement.textContent = 'User not found';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Login';
                    return;
                }
                
                let userFound = false;
                userSnapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if (data.password === password) {
                        userFound = true;
                        currentUser = {
                            id: childSnapshot.key,
                            username: data.username,
                            displayName: data.displayName,
                            avatar: data.avatar
                        };
                    }
                });
                
                if (userFound) {
                    const isBanned = await bansRef.child(currentUser.id).once('value');
                    if (isBanned.exists()) {
                        const banData = isBanned.val();
                        if (!banData.expiresAt || banData.expiresAt > Date.now()) {
                            errorElement.textContent = 'You are banned from this server';
                            submitButton.disabled = false;
                            submitButton.textContent = 'Login';
                            return;
                        } else {
                            await bansRef.child(currentUser.id).remove();
                        }
                    }
                    
                    localStorage.setItem('chatUser', JSON.stringify(currentUser));
                    isAdmin = currentUser.username === ADMIN_USERNAME;
                    
                    const snapshot = await channelsRef.once('value');
                    if (snapshot.numChildren() > 0) {
                        snapshot.forEach(child => {
                            if (!currentChannel) currentChannel = child.key;
                        });
                    }
                    
                    renderMainApp();
                } else {
                    errorElement.textContent = 'Invalid password';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Login';
                }
            } else {
                const existingUser = await usersRef.orderByChild('username').equalTo(username).once('value');
                
                if (existingUser.exists()) {
                    errorElement.textContent = 'Username already taken';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Register';
                    return;
                }
                
                const newUserRef = usersRef.push();
                await newUserRef.set({
                    username: username,
                    password: password,
                    displayName: username,
                    avatar: null,
                    createdAt: Date.now()
                });
                
                currentUser = {
                    id: newUserRef.key,
                    username: username,
                    displayName: username,
                    avatar: null
                };
                localStorage.setItem('chatUser', JSON.stringify(currentUser));
                isAdmin = currentUser.username === ADMIN_USERNAME;
                
                const snapshot = await channelsRef.once('value');
                if (snapshot.numChildren() > 0) {
                    snapshot.forEach(child => {
                        if (!currentChannel) currentChannel = child.key;
                    });
                }
                
                renderMainApp();
            }
        } catch (error) {
            errorElement.textContent = 'Error: ' + (error.message || 'Unknown error');
            submitButton.disabled = false;
            submitButton.textContent = isLoginMode ? 'Login' : 'Register';
        }
    }
    
    function switchAdminTab(tab) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
        
        if (tab === 'users') {
            document.querySelector('.admin-tab:first-child').classList.add('active');
            document.getElementById('usersPanel').classList.add('active');
        } else if (tab === 'roles') {
            document.querySelector('.admin-tab:nth-child(2)').classList.add('active');
            document.getElementById('rolesPanel').classList.add('active');
        } else if (tab === 'channels') {
            document.querySelector('.admin-tab:nth-child(3)').classList.add('active');
            document.getElementById('channelsPanel').classList.add('active');
        }
    }

    async function init() {
        const savedUser = localStorage.getItem('chatUser');
        if (savedUser) {
            try {
                const userData = JSON.parse(savedUser);
                const userCheck = await usersRef.child(userData.id).once('value');
                if (userCheck.exists()) {
                    const userVal = userCheck.val();
                    currentUser = {
                        id: userData.id,
                        username: userVal.username,
                        displayName: userVal.displayName,
                        avatar: userVal.avatar
                    };
                    
                    const isBanned = await bansRef.child(currentUser.id).once('value');
                    if (isBanned.exists()) {
                        const banData = isBanned.val();
                        if (!banData.expiresAt || banData.expiresAt > Date.now()) {
                            localStorage.removeItem('chatUser');
                            renderAuthScreen();
                            return;
                        } else {
                            await bansRef.child(currentUser.id).remove();
                        }
                    }
                    
                    isAdmin = currentUser.username === ADMIN_USERNAME;
                    
                    const snapshot = await channelsRef.once('value');
                    if (snapshot.numChildren() > 0) {
                        snapshot.forEach(child => {
                            if (!currentChannel) currentChannel = child.key;
                        });
                    }
                    
                    renderMainApp();
                    return;
                }
            } catch (error) {
                console.error('Auto login error:', error);
            }
        }
        
        renderAuthScreen();
    }
    
    init();
</script>
</body>
</html>
